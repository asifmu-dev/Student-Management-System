<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Student Management System</h2>

        <div class="card p-4 mb-4">
            <input type="hidden" id="editIndex">

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter student name">
            </div>

            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" id="age" class="form-control" placeholder="Enter age">
            </div>

            <div class="mb-3">
                <label class="form-label">Course</label>
                <input type="text" id="course" class="form-control" placeholder="Enter course">
            </div>

            <button class="btn btn-primary" id="saveBtn"
                    onclick="addStudent()">Add Student</button>
        </div>

        <div class="card p-3">
            <h4>Student Records</h4>

            <div class="table-responsive">
                <table class="table table-bordered table-striped mt-3">
                    <thead class="table-dark">
                        <tr>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Course</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
